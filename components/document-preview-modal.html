<!-- Document Preview Modal -->
<div class="modal-overlay" id="doc-viewer-modal" style="z-index: 1050;">
    <div class="modal-container large-viewer">
        
        <div class="viewer-header">
            <div class="doc-identity">
                <i class="ri-file-text-fill"></i>
                <span id="view-doc-title">Document Title</span>
                <span class="id-pill" id="view-doc-id">DOC-ID</span>
            </div>
            <div class="header-tools">
                <button class="close-btn" id="close-preview-btn"><i class="ri-close-line"></i></button>
            </div>
        </div>

        <!-- Viewer Body -->
        <div class="viewer-body">
            <!-- PDF Preview Section -->
            <div class="doc-preview-section">
                <iframe id="pdf-viewer-frame" src="" width="100%" height="100%" style="border:none; display:none;"></iframe>
                <div class="pdf-placeholder" id="pdf-fallback">
                    <p style="font-weight:600; color:#475569;">Loading Preview...</p>
                </div>
            </div>

            <!-- Document Sidebar -->
            <div class="doc-sidebar">
                
                <div class="sidebar-group">
                    <h5>Document Properties</h5>
                    <div class="prop-item"><label>Status</label><span class="status-badge" id="view-status">...</span></div>
                    <div class="prop-item"><label>Department</label><span id="view-dept">...</span></div>
                    <div class="prop-item"><label>Category</label><span id="view-category">...</span></div>
                    <div class="prop-item"><label>Description</label><span id="view-description" style="font-style: italic; color: #64748b;">...</span></div>
                    <div class="prop-item"><label>Date Created</label><span id="view-date">...</span></div>
                    
                    <div class="prop-item" style="background:#f8fafc; padding:8px; border-radius:6px; border:1px solid #e2e8f0; margin-top:10px;">
                        <label style="color:#3b82f6; font-weight:700;">Latest Activity / Remark</label>
                        <span id="view-latest-remark" style="font-size:0.85rem; color:#334155;">Loading...</span>
                    </div>
                </div>

                <div class="sidebar-divider" style="margin: 1rem 0; border-top: 1px solid #e2e8f0;"></div>

                <div class="sidebar-group">
                    <h5>Routing Sequence</h5>
                    <div class="route-stepper" id="view-route-list">
                        <div style="font-size:0.8rem; color:#94a3b8;">Loading route...</div>
                    </div>
                </div>
                
                <div class="sidebar-divider" style="margin: 1rem 0; border-top: 1px solid #e2e8f0;"></div>
                
                <div class="sidebar-group">
                    <h5>Actions</h5>
                    <button class="sidebar-btn" id="btn-view-timeline">
                        <i class="ri-history-line"></i> View Timeline
                    </button>
                    
                    <button class="sidebar-btn" id="btn-download-pdf">
                        <i class="ri-download-2-line"></i> Download PDF
                    </button>
                    
                    <button class="sidebar-btn" id="btn-sign-doc" style="display:none;">
                        <i class="ri-pen-nib-line"></i> Sign Document
                    </button>
                    
                    <button class="sidebar-btn" id="btn-note-doc" style="display:none; background-color: #3b82f6; color: white; border: 1px solid #3b82f6;">
                        <i class="ri-checkbox-circle-line"></i> Note Document (As Noted By)
                    </button>
                    
                    <button class="sidebar-btn" id="btn-transfer-doc" style="display:none;">
                        <i class="ri-share-forward-line"></i> Transfer
                    </button>

                    <button class="sidebar-btn" id="btn-reject-doc" style="display:none; color: #dc2626; background: #fee2e2; border: 1px solid #fca5a5;">
                        <i class="ri-error-warning-line"></i> Return / Reject
                    </button>

                    <button class="sidebar-btn" id="btn-archive-doc" style="display:none; background-color: #10b981; color: white; border: 1px solid #10b981;">
                        <i class="ri-archive-line"></i> Archive / Move to Records
                    </button>

                    <button class="sidebar-btn" id="btn-release-doc" style="display:none; background-color: #2563EB; color: white; border: 1px solid #2563EB;">
                        <i class="ri-send-plane-fill"></i> Release Document
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
