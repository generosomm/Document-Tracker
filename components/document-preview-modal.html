<div class="modal-overlay" id="doc-viewer-modal" style="z-index: 1050;">
    <div class="modal-container large-viewer">
        <div class="viewer-header">
            <div class="doc-identity">
                <i class="ri-file-text-fill"></i>
                <span id="view-doc-title">Title</span>
                <span class="id-pill" id="view-doc-id">ID</span>
            </div>
            <div class="header-tools">
                <button class="close-btn" id="close-preview-btn"><i class="ri-close-line"></i></button>
            </div>
        </div>
        <div class="viewer-body">
            <div class="doc-preview-section">
                <div class="pdf-placeholder">
                    <img src="../assets/images/city-of-sto-tomas-logo.jpg" class="watermark" alt="Logo" style="opacity:0.1; width:150px; margin-bottom:20px;">
                    <p style="font-weight:600; color:#475569;">Document Preview Mode</p>
                    <span class="sub-text" style="font-size:0.85rem; color:#94a3b8;">PDF Content would load here</span>
                </div>
            </div>
            <div class="doc-sidebar">
                <div class="sidebar-group">
                    <h5>Document Properties</h5>
                    <div class="prop-item"><label>Status</label><span class="status-badge" id="view-status">...</span></div>
                    <div class="prop-item"><label>Department</label><span id="view-dept">...</span></div>
                    <div class="prop-item"><label>Category</label><span id="view-category">...</span></div>
                    <div class="prop-item"><label>Assigned To</label><span id="view-assignee">...</span></div>
                    <div class="prop-item"><label>Date Created</label><span id="view-date">...</span></div>
                </div>
                <div class="sidebar-divider" style="margin: 1rem 0; border-top: 1px solid #e2e8f0;"></div>
                <div class="sidebar-group">
                    <h5>Actions</h5>
                    <button class="sidebar-btn" id="btn-view-timeline"><i class="ri-history-line"></i> View Timeline</button>
                    <button class="sidebar-btn" onclick="alert('Downloading...')"><i class="ri-download-2-line"></i> Download PDF</button>
                    <button class="sidebar-btn" onclick="openSignModal()"><i class="ri-pen-nib-line"></i> Sign Document</button>
                    <button class="sidebar-btn" id="btn-transfer-doc"><i class="ri-share-forward-line"></i> Transfer</button>
                </div>
            </div>
        </div>
    </div>
</div>
