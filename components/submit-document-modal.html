<div class="modal-overlay" id="submit-modal" style="z-index: 9999;">
    <div class="modal-container">
        <div class="modal-header">
            <div>
                <h3>Submit New Document</h3>
                <p>Upload a PDF document and set up routing.</p>
            </div>
            <button class="close-btn" id="close-submit-modal"><i class="ri-close-line"></i></button>
        </div>
        <div class="modal-body">
            <form id="document-form">
                <div class="form-group">
                    <label>Document Title *</label>
                    <input type="text" id="doc-title-input" placeholder="Enter title" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="doc-desc-input" rows="2" placeholder="Enter description"></textarea>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="category-select" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Contracts">Contracts</option>
                        <option value="Invoices">Invoices</option>
                        <option value="Reports">Reports</option>
                        <option value="Memos">Memos</option>
                        <option value="Legal">Legal Documents</option>
                    </select>
                    <p class="helper-text">Auto-fills routing sequence.</p>
                </div>
                <div class="form-group">
                    <label>Routing Sequence (Drag to Reorder) *</label>
                    <div class="routing-container" id="routing-list">
                        <div class="empty-state">Select a category to view routing</div>
                    </div>
                    <div id="path-container" style="margin-top: 10px; padding: 10px; background: #eff6ff; border: 1px solid #dbeafe; border-radius: 6px; color: #1e40af; font-size: 0.85rem; display:none;">
                        <strong style="display:block; margin-bottom:4px; color:#1e3a8a;">Path:</strong>
                        <span id="path-text"></span>
                    </div>
                    <div class="routing-actions">
                        <div class="action-buttons">
                            <button type="button" class="btn-text" id="add-dept-btn">+ Add Dept</button>
                            <button type="button" class="btn-text text-red" id="clear-route-btn">Clear</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Upload PDF *</label>
                    <div class="file-upload-box">
                        <input type="file" id="file-upload" accept=".pdf" required>
                        <div class="file-info">
                            <span id="file-name" class="file-name">Choose PDF File</span>
                            <span class="file-meta">Max 10MB</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancel-submit-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="final-submit-btn">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>
