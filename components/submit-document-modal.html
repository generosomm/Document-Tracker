<!-- Submit Document Modal -->
<div class="modal-overlay" id="submit-modal">
  <div class="modal-container">
    <div class="modal-header">
      <div>
        <h3>Submit New Document</h3>
        <p>Upload a PDF and configure its routing path.</p>
      </div>
      <button class="close-btn" id="close-submit-modal">
        <i class="ri-close-line"></i>
      </button>
    </div>

    <form id="document-form" class="modal-form-wrapper">
      <div class="modal-body">
        <div class="form-section">
          <h4 class="section-title">Document Details</h4>
          <div class="form-group">
            <label>Document Title *</label>
            <input type="text" id="doc-title-input" placeholder="Enter document title" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="doc-desc-input" rows="2" placeholder="Optional short description"></textarea>
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="category-select" required>
              <option value="" disabled selected>Select category</option>
            </select>
            <p class="helper-text">Routing sequence is based on admin configuration.</p>
          </div>
        </div>

        <div class="form-section">
          <h4 class="section-title">Routing</h4>
          <div class="routing-container" id="routing-list">
            <div class="empty-state">Select a category to generate routing sequence</div>
          </div>
          <div id="path-container">
            <strong>Path</strong>
            <span id="path-text"></span>
          </div>
          <div class="routing-actions">
            <button type="button" class="btn-text" id="add-dept-btn">+ Add Department</button>
            <button type="button" class="btn-text text-red" id="clear-route-btn">Clear</button>

            <div id="dept-selector-popup" class="dept-selector-popup">
              <div class="popup-header">
                <span>Select Department</span>
                <i class="ri-close-line" id="close-dept-popup" style="cursor: pointer;"></i>
              </div>
              <div style="padding: 10px; border-bottom: 1px solid #f1f5f9;">
                <input type="text" id="dept-search-input" placeholder="Search department...">
              </div>
              <div id="dept-list-options" class="dept-list-options"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Upload PDF *</label>
          <div class="file-upload-box" id="modal-drop-zone">
            <input type="file" id="file-upload" accept=".pdf" required>
            <div class="file-info">
              <span id="file-name" class="file-name">Drop PDF here or click to choose</span>
              <span class="file-meta">PDF Only • Max 25MB</span>
            </div>
          </div>
          <div id="fileList"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancel-submit-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="final-submit-btn">Submit</button>
      </div>
    </form>
  </div>
</div>
