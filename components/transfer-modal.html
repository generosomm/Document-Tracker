<!-- Transfer Document Modal -->
<div class="modal-overlay" id="transfer-modal">
    <div class="modal-container transfer-style">
        
        <div class="modal-header">
            <div class="header-left">
                <div class="icon-circle">
                    <i class="ri-share-forward-fill"></i>
                </div>
                <h3>Transfer Document</h3>
            </div>
            <button class="close-btn" id="close-transfer-btn"><i class="ri-close-line"></i></button>
        </div>
        
        <div class="modal-body">
            
            <div class="info-box">
                <div class="route-label-row">
                    <i class="ri-map-pin-line"></i>
                    <span>Current Location</span>
                </div>
                <h4 id="route-current">Checking...</h4>

                <div class="route-divider"></div>

                <div class="route-label-row target">
                    <i class="ri-arrow-right-circle-fill"></i>
                    <span>Transferring To</span>
                </div>
                <h2 id="route-next">Calculating...</h2>
            </div>

            <div class="form-group">
                <label for="transfer-remarks">Remarks / Instructions (Optional)</label>
                <textarea id="transfer-remarks" rows="3" placeholder="Add notes for the receiver..."></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-text" id="cancel-transfer-btn">Cancel</button>
            <button class="btn btn-primary" id="confirm-transfer-btn" disabled>
                Confirm Transfer
            </button>
        </div>
    </div>
</div>
